name: Split Canva export into email images
on:
  push:
    paths: ['incoming/*.json']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: |
          for f in incoming/*.json; do python tools/split_export.py "$f"; git rm -q "$f"; done
      - run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add newsletter images" || echo "nothing to commit"
          git push
